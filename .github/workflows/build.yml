name: Build Racing Pedals APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            libtool-bin \
            libltdl-dev \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev \
            gettext \
            autopoint

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --upgrade buildozer cython

      - name: Configure Buildozer
        run: |
          sed -i 's/^# *android.accept_sdk_license.*/android.accept_sdk_license = True/' buildozer.spec
          sed -i 's/^# *p4a.branch.*/p4a.branch = develop/' buildozer.spec

          echo "===== buildozer.spec ====="
          cat buildozer.spec

      - name: Clean old build files
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build APK
        run: |
          buildozer android debug

      - name: List APK files
        if: always()
        run: |
          echo "===== APK FILES ====="
          find . -type f \( -name "*.apk" -o -name "*.aab" \) -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Racing-Pedals-APK
          path: |
            bin/*.apk
          if-no-files-found: error
